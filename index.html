<title>QC Inspection Study</title>
<style>

<script>

/* ================================================================
   STANDALONE BUILD -- runs from any browser, saves to Google Sheets
   Setup instructions: see Standalone_Setup_Guide.md
   Until ENDPOINT_URL is filled in the tool runs in OFFLINE MODE:
   everything works, and each finished session downloads itself as
   a .json file so nothing is lost.
   ================================================================ */
const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbyD0EUwEBFovPpaODk7S3SK_67E89Z3YG5S_i8mWLxesTVDhGuehCvzCGmX3ns2t-Qe/exec"; // <-- paste your Apps Script /exec URL here

// Shared secret. Must match STUDY_TOKEN in the Apps Script. Anyone who views
// this page's source can read it, so it does not make the endpoint private --
// it only stops casual junk submissions from someone who stumbles on the URL.
// Change it to any random string you like, then change it in the script too.
const STUDY_TOKEN = "ise3810-herbert-callahan";

// Gate on the research dashboard. Participants can see the link at the bottom
// of the welcome screen, so this keeps them from wandering into the data.
const ADMIN_PASSPHRASE = "Kimmy";

const OFFLINE = () => !ENDPOINT_URL;
const LS_KEY = "qc_study_local_sessions";

function localBuffer() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { return []; }
}
function pushLocal(rec) {
  try { const all = localBuffer(); all.push(rec); localStorage.setItem(LS_KEY, JSON.stringify(all)); }
  catch (e) {}
}
function downloadFallback(rec) {
  try { dl(JSON.stringify(rec, null, 2), "qc_session_" + rec.participantId + ".json", "application/json"); }
  catch (e) {}
}

/* --- READS use JSONP. ---------------------------------------------------
   Apps Script cannot answer a CORS preflight, and a page opened straight
   from a file:// path has a null origin, so plain fetch() reads fail. A
   <script> tag is not subject to CORS, so JSONP works from anywhere,
   including a local file. ---------------------------------------------- */
let __jsonpSeq = 0;
function jsonp(params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cb = "__qccb" + (++__jsonpSeq) + "_" + Date.now();
    const s = document.createElement("script");
    let done = false;
    const cleanup = () => {
      done = true;
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    };
    window[cb] = (data) => { if (!done) { cleanup(); resolve(data); } };
    s.onerror = () => { if (!done) { cleanup(); reject(new Error("JSONP load failed")); } };
    const q = Object.keys(params).map((k) => encodeURIComponent(k) + "=" + encodeURIComponent(params[k])).join("&");
    s.src = ENDPOINT_URL + "?" + q + "&callback=" + cb;
    document.body.appendChild(s);
    setTimeout(() => { if (!done) { cleanup(); reject(new Error("JSONP timed out")); } }, timeoutMs || 15000);
  });
}

/* --- WRITES try a readable POST first, then fall back to no-cors. -------
   no-cors still delivers the request to Apps Script (which saves it); we
   just cannot read the reply, so we verify separately. ------------------ */
async function postSession(rec) {
  const body = JSON.stringify({ action: "save", token: STUDY_TOKEN, record: rec });
  try {
    const res = await fetch(ENDPOINT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body,
    });
    const out = await res.json();
    if (out && out.status === "ok") return "confirmed";
    throw new Error("endpoint returned an error");
  } catch (e) {
    await fetch(ENDPOINT_URL, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body,
    });
    return "sent-unconfirmed";
  }
}

async function postFeedback(fb) {
  const body = JSON.stringify({ action: "feedback", token: STUDY_TOKEN, feedback: fb });
  try {
    const res = await fetch(ENDPOINT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body,
    });
    const out = await res.json();
    if (out && out.status === "ok") return "confirmed";
    throw new Error("endpoint returned an error");
  } catch (e) {
    await fetch(ENDPOINT_URL, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body,
    });
    return "sent-unconfirmed";
  }
}

async function fetchAllSessions() {
  const out = await jsonp({ action: "list", token: STUDY_TOKEN });
  return (out && out.records) || [];
}
async function fetchCounts() {
  const out = await jsonp({ action: "counts", token: STUDY_TOKEN });
  return (out && out.counts) || null;
}
async function pingEndpoint() {
  const out = await jsonp({ action: "counts", token: STUDY_TOKEN }, 12000);
  return out && out.status === "ok";
}

/* ================================================================
   QC INSPECTION STUDY -- final instrument
   ISE 3810 -- AI Reliability & Automation Bias
   Herbert & Callahan

   DESIGN RATIONALE (read before modifying)

   Judge-advisor structure. Each scored trial captures the
   participant's OWN call and confidence BEFORE any AI advice is
   shown, then shows the advice, then captures a final call and
   confidence. This is the standard advice-taking paradigm and it
   is the only way to distinguish genuine independent agreement
   from deference. Without a pre-advice judgment, "agreed with AI"
   is uninterpretable. Both stages live on ONE card with progressive
   reveal -- no page transitions -- so it reads as a single question.

   No accept-shortcut button. Earlier drafts had a one-click
   "Accept AI's Recommendation" button. It was removed: it makes
   agreeing mechanically cheaper than disagreeing, so it measures
   button affordance as much as trust and confounds the primary DV.
   Final response uses identical Pass/Fail buttons regardless of
   what the AI said. Equal effort both ways.

   AI advice always shown (never optional). Optional consultation
   produces missing reliance data for anyone who skips it, which is
   fatal at n~15/group. Exposure is held constant; effort is instead
   measured by the voluntary Inspection Data dropdown.

   No trial-by-trial correctness feedback. Feedback would let
   participants learn the reliability rate mid-session, converting
   this into a learning study and contaminating the between-group
   comparison. Trust trajectory is captured instead by three trust
   probes (after trials 8, 16, and at the end).

   Difficulty is computed, not hand-labeled: Easy (visual decides),
   Medium / Hard (measurement decides; split by distance to the
   tolerance edge), Ambiguous (displayed reading carries an explicit
   uncertainty band that straddles the tolerance line, so the truth
   is NOT recoverable from what the human is shown -- only the AI,
   framed as holding a more precise internal reading, can resolve
   it). Ambiguous trials are where reliance is a real dilemma
   rather than laziness.

   Error placement spans every difficulty tier in the low condition
   so the reliability x difficulty interaction is testable.

   TO SWAP IN REAL STIMULI: edit PART_LIBRARY. Keep groundTruth,
   the measurement numbers, and (for ambiguous items) uncertainty
   accurate; everything downstream computes itself.
   ================================================================ */

// Scripted incorrect AI verdicts, by condition. Fixed (not random per
// participant) so achieved reliability is identical for everyone in a group.
// High: 5/24 wrong = 79.2% correct.  Low: 11/24 wrong = 54.2% correct.
// Errors span every tier AND both directions of note-misuse, so "the AI cited
// the inspector's note" is never a reliable tell that the AI is wrong.
//    6  Measurement Pass                      -> AI says Fail
//    9  Measurement Fail                      -> AI says Pass
//   13  Judgment Fail (decisive note)         -> AI dismisses it, says Pass
//   17  Judgment Pass (circumstantial note)   -> AI over-trusts it, says Fail
//   21  Ambiguous
const WRONG_INDICES = {
  none: [],
  high: [6, 9, 13, 17, 21],
  low:  [2, 5, 7, 8, 10, 12, 15, 16, 19, 20, 23],
};
const CONDITIONS = ["none", "high", "low"];
const CONDITION_LABEL = { none: "No AI assistance", high: "High-reliability AI", low: "Low-reliability AI" };
const TRUST_PROBE_AFTER = [8, 16]; // trial numbers after which a trust probe appears

// ---------------- COMPUTED HELPERS ----------------
function inTolerance(m) { return m.value >= m.specLow && m.value <= m.specHigh; }
function measurementDisplay(m) {
  return m.uncertainty
    ? `${m.value.toFixed(2)} \u00b1 ${m.uncertainty.toFixed(2)} ${m.unit}`
    : `${m.value.toFixed(2)} ${m.unit}`;
}
function specDisplay(m) { return `${m.specLow.toFixed(2)}\u2013${m.specHigh.toFixed(2)} ${m.unit}`; }
function marginRatio(m) {
  const half = (m.specHigh - m.specLow) / 2;
  return Math.min(Math.abs(m.value - m.specLow), Math.abs(m.value - m.specHigh)) / half;
}
function difficultyOf(part) { return part.tier; }
function visualFactText(part) {
  if (!part.crack) return "No visible surface defects.";
  if (part.crack.op >= 0.9) return "Visible crack observed on the surface.";
  return "A faint surface mark is visible; inconclusive on its own.";
}

// ---------------- AI ADVICE ----------------
// Every fact the AI states is TRUE. When the AI is scripted wrong it does not
// lie -- it reasons from a real but non-determinative signal (the inspector
// note) and reaches a conclusion that doesn't follow. On ambiguous trials it
// appeals to an internal reading the human cannot check either way.
function aiAdvice(part, isWrong) {
  const flip = part.groundTruth === "Pass" ? "Fail" : "Pass";
  const verdict = isWrong ? flip : part.groundTruth;
  const claim = verdict === "Pass"
    ? "I recommend this part be accepted."
    : "I recommend this part be rejected.";
  const m = part.measurement;
  const inTol = m.uncertainty ? null : inTolerance(m);
  const NOTE = "the inspector's note";

  // Ambiguous: the displayed reading cannot resolve the call either way, so the
  // AI appeals to an internal reading the operator has no way to check.
  if (part.ambiguous) {
    return { verdict, basis: "internal-reading",
      citation: claim + " The reported " + m.label.toLowerCase() + " of " + measurementDisplay(m) +
        " carries an uncertainty band that overlaps the specified limit of " + specDisplay(m) +
        ", so the displayed value alone does not resolve it. Our internal reading resolves finer than the displayed range and falls " +
        (verdict === "Pass" ? "inside" : "outside") + " the limit." };
  }

  // Visual-decisive.
  if (part.decisiveEvidence === "visual") {
    if (!isWrong) return { verdict, basis: "visual", citation: claim + " " + visualFactText(part) };
    return { verdict, basis: "visual",
      citation: verdict === "Pass"
        ? claim + " The surface irregularity is cosmetic in character and the unit remains serviceable."
        : claim + " Surface review indicates an irregularity consistent with a rejectable condition." };
  }

  // Measurement-decisive.
  if (part.decisiveEvidence === "measurement") {
    if (!isWrong) {
      return { verdict, basis: "measurement",
        citation: claim + " The " + m.label.toLowerCase() + " measures " + measurementDisplay(m) +
          " against a specified tolerance of " + specDisplay(m) + ", placing it " +
          (inTol ? "inside" : "outside") + " the limit. That reading governs conformance here." };
    }
    if (verdict === "Fail") {
      return { verdict, basis: "note",
        citation: claim + " " + NOTE + ' records: "' + part.note +
          '" Weighed against a reading that sits near the edge of its band, that history is the stronger signal for this unit.' };
    }
    return { verdict, basis: "measurement",
      citation: claim + " The " + m.label.toLowerCase() + " reading of " + measurementDisplay(m) +
        " is a marginal excursion consistent with normal process variation, and the inspection record shows no confirmed defect on this unit." };
  }

  // Judgment tier: dimensions are in tolerance and the NOTE decides.
  if (part.noteType === "decisive") {
    if (!isWrong) {
      return { verdict, basis: "note",
        citation: claim + " The " + m.label.toLowerCase() + " of " + measurementDisplay(m) +
          " is within the specified tolerance of " + specDisplay(m) + ", but " + NOTE +
          ' records a confirmed condition on this specific unit: "' + part.note +
          '" A documented defect on the unit itself governs the disposition regardless of dimensional conformance.' };
    }
    // Wrong: dismisses genuine unit-specific evidence in favour of the numbers.
    return { verdict, basis: "measurement",
      citation: claim + " The " + m.label.toLowerCase() + " of " + measurementDisplay(m) +
        " is within the specified tolerance of " + specDisplay(m) +
        ", and dimensional conformance is the governing acceptance criterion. The accompanying note is supplementary and does not by itself establish non-conformance." };
  }

  // Circumstantial note.
  if (!isWrong) {
    return { verdict, basis: "note",
      citation: claim + " The " + m.label.toLowerCase() + " of " + measurementDisplay(m) +
        " is within the specified tolerance of " + specDisplay(m) + ". " +
        NOTE.charAt(0).toUpperCase() + NOTE.slice(1) + ' ("' + part.note +
        '") refers to other units and to lot history rather than to a confirmed condition on this unit, so it does not establish non-conformance here.' };
  }
  // Wrong: treats lot/vendor history as though it were evidence about this unit.
  return { verdict, basis: "note",
    citation: claim + " " + NOTE + ' records: "' + part.note +
      '" Given that documented history, the risk profile for this unit is elevated and rejection is the conservative disposition.' };
}

// Admin-only preview: jump straight to any participant screen. Nothing is saved

function startPreview(screen, condition) {

function addPreviewBanner() {

function uid() { return "P-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }
function shuffledIndices(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

async function assignCondition(population) {
  let counts = null;
  if (!OFFLINE()) { try { counts = await fetchCounts(); } catch (e) { counts = null; } }
  if (!counts) {
    counts = { student: { none: 0, high: 0, low: 0 }, professional: { none: 0, high: 0, low: 0 } };
    localBuffer().forEach((r) => {
      if (counts[r.population] && counts[r.population][r.condition] !== undefined) counts[r.population][r.condition] += 1;
    });
  }
  const b = counts[population] || { none: 0, high: 0, low: 0 };
  const min = Math.min(b.none, b.high, b.low);
  const tied = CONDITIONS.filter((c) => b[c] === min);
  return tied[Math.floor(Math.random() * tied.length)];
}

// ---------------- PART RENDER ----------------
function drawPart(part) {
  const crack = part.crack ? `
    <path d="M 70 38 L ${70 + part.crack.len * 0.42} ${38 + part.crack.len * 0.48} L ${58 + part.crack.len * 0.5} ${44 + part.crack.len * 0.66}"
      stroke="#7a2f1f" stroke-width="2.6" fill="none" opacity="${part.crack.op}" stroke-linecap="round"/>
    <path d="M 70 38 L ${70 + part.crack.len * 0.42} ${38 + part.crack.len * 0.48} L ${58 + part.crack.len * 0.5} ${44 + part.crack.len * 0.66}"
      stroke="#c96a4a" stroke-width="0.8" fill="none" opacity="${part.crack.op * 0.7}" stroke-linecap="round"/>` : "";
  return `
  <svg width="172" height="172" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="mg" cx="38%" cy="32%" r="75%"><stop offset="0%" stop-color="#f3f6f8"/><stop offset="55%" stop-color="#dbe3e8"/><stop offset="100%" stop-color="#b9c5cc"/></radialGradient>
      <radialGradient id="hg" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e3e9ec"/></radialGradient>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1c2b33" flood-opacity="0.18"/></filter>
    </defs>
    <ellipse cx="70" cy="122" rx="42" ry="6" fill="#1c2b33" opacity="0.08"/>
    <circle cx="70" cy="70" r="52" fill="url(#mg)" stroke="#8fa3ad" stroke-width="1.5" filter="url(#sh)"/>
    <circle cx="70" cy="70" r="52" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
    ${Array.from({ length: 8 }).map((_, i) => {
      const a = (i / 8) * Math.PI * 2;
      return `<circle cx="${70 + Math.cos(a) * 40}" cy="${70 + Math.sin(a) * 40}" r="3.2" fill="#c3ced4" stroke="#8fa3ad" stroke-width="0.8"/>`;
    }).join("")}
    <circle cx="70" cy="70" r="19" fill="url(#hg)" stroke="#8fa3ad" stroke-width="1.5"/>
    <circle cx="70" cy="70" r="6" fill="#c3ced4" stroke="#8fa3ad" stroke-width="1"/>
    ${crack}
  </svg>`;
}

const app = document.getElementById("app");
function render() {
  const old = document.getElementById("pvBanner");
  if (old) old.remove();
  app.style.paddingBottom = state.preview ? "64px" : "";
  renderScreen();
  if (state.preview) addPreviewBanner();
}
function renderScreen() {
  app.innerHTML = "";
  const s = state.screen;
  if (s === "welcome") return renderWelcome();
  if (s === "intake") return renderIntake();
  if (s === "instructions") return renderInstructions();
  if (s === "practice" || s === "trial") return renderTrial(s === "practice");
  if (s === "trustprobe") return renderTrustProbe();
  if (s === "post") return renderPost();
  if (s === "done") return renderDone();
  if (s === "admin") return renderAdmin();
}
function card(html) {
  const d = document.createElement("div");
  d.className = "card"; d.innerHTML = html; app.appendChild(d); return d;
}
function stepTrack(done, total) {
  return `<div class="step-track">${Array.from({ length: total }).map((_, i) =>
    `<div class="seg"><div class="fill" style="width:${i < done ? 100 : 0}%"></div></div>`).join("")}</div>`;
}
function scaleRowHTML(group, min, max, lo, hi) {
  let b = "";
  for (let i = min; i <= max; i++) b += `<button class="scale-btn" data-v="${i}">${i}</button>`;
  return `<div class="scale-row" data-group="${group}">${b}</div><div class="scale-labels"><span>${lo}</span><span>${hi}</span></div>`;
}
function evidencePanelHTML(part) {
  return `
    <div class="evidence-row"><span>Visual Inspection</span></div>
    <div class="evidence-note" style="margin-bottom:10px;">${visualFactText(part)}</div>
    <div class="evidence-row"><span>${part.measurement.label}</span><span class="val mono">${measurementDisplay(part.measurement)}</span></div>
    <div class="evidence-row"><span>Specified tolerance</span><span class="val mono">${specDisplay(part.measurement)}</span></div>
    <div class="evidence-note">Inspector note: ${part.note}</div>`;
}

// ---------------- TRIAL (single card, progressive reveal) ----------------
function renderTrial(isPractice) {
  let part, idx = null;
  if (isPractice) part = PRACTICE_LIBRARY[state.practiceIdx];
  else { idx = state.trialOrder[state.trialIdx]; part = PART_LIBRARY[idx]; }

  const showAI = state.condition !== "none";
  const total = isPractice ? PRACTICE_LIBRARY.length : PART_LIBRARY.length;
  const current = (isPractice ? state.practiceIdx : state.trialIdx) + 1;
  const advice = showAI ? aiAdvice(part, isPractice ? false : WRONG_INDICES[state.condition].includes(idx)) : null;

  const el = card(`
    <span class="eyebrow">${isPractice ? "Practice \u2014 Not Scored" : "Trial " + current + " of " + total}</span>
    ${isPractice ? "" : stepTrack(current - 1, total)}
    <div class="part-frame">${drawPart(part)}</div>
    <div class="part-id mono">UNIT ${part.id}</div>
    <button class="dropdown-toggle" id="ev-t"><span>+ Inspection Data</span></button>
    <div class="dropdown-panel" id="ev-p" style="display:none;">${evidencePanelHTML(part)}</div>
    <div id="flow"></div>
  `);

  const t0 = performance.now();
  let evidenceChecked = false, evidenceViewTimeMs = null, evidenceReopened = false;
  const rec = {};

  el.querySelector("#ev-t").onclick = () => {
    const p = el.querySelector("#ev-p");
    const opening = p.style.display === "none";
    p.style.display = opening ? "block" : "none";
    el.querySelector("#ev-t").innerHTML = opening ? "<span>\u2212 Inspection Data</span>" : "<span>+ Inspection Data</span>";
    if (opening) {
      if (!evidenceChecked) { evidenceChecked = true; evidenceViewTimeMs = Math.round(performance.now() - t0); }
      else if (rec.initialResponse) evidenceReopened = true;
    }
  };

  const flow = el.querySelector("#flow");

  // --- Stage 1: own assessment ---
  function stageInitial() {
    flow.innerHTML = `
      <div class="stage-block">
        <h3>${showAI ? "Your assessment" : "Your decision"}</h3>
        <div class="choice-row">
          <button class="choice-btn pass" data-v="Pass">Pass</button>
          <button class="choice-btn fail" data-v="Fail">Fail</button>
        </div>
      </div>`;
    flow.querySelectorAll(".choice-btn").forEach((b) => {
      b.onclick = () => {
        rec.initialResponse = b.dataset.v;
        rec.initialResponseTimeMs = Math.round(performance.now() - t0);
        stageInitialConfidence();
      };
    });
  }

  function stageInitialConfidence() {
    flow.innerHTML = `
      <div class="stage-block">
        <div class="locked-chip">Your assessment: <b>${rec.initialResponse.toUpperCase()}</b></div>
        <h3>How confident are you in that call?</h3>
        ${scaleRowHTML("ic", 1, 5, "Not confident", "Very confident")}
      </div>`;
    flow.querySelectorAll(".scale-btn").forEach((b) => {
      b.onclick = () => {
        rec.initialConfidence = Number(b.dataset.v);
        if (!showAI) { finalize(rec.initialResponse, rec.initialConfidence); return; }
        stageAdvice();
      };
    });
  }

  // --- Stage 2: AI advice + final call ---
  function stageAdvice() {
    const conflict = rec.initialResponse !== advice.verdict;
    rec.adviceShownAtMs = Math.round(performance.now() - t0);
    flow.innerHTML = `
      <div class="stage-block">
        <div class="locked-chip">Your assessment: <b>${rec.initialResponse.toUpperCase()}</b></div>
        <div class="ai-block">
          <div class="ai-verdict-line">
            <span class="ai-badge">AI</span>
            <span class="ai-verdict ${advice.verdict === "Pass" ? "yes" : "no"}">Recommendation: ${advice.verdict === "Pass" ? "PASS" : "FAIL"}</span>
          </div>
          <div class="ai-citation">${advice.citation}</div>
        </div>
        <h3>Your final decision</h3>
        <div class="choice-row">
          <button class="choice-btn pass" data-v="Pass">Pass</button>
          <button class="choice-btn fail" data-v="Fail">Fail</button>
        </div>
      </div>`;
    rec.conflict = conflict;
    flow.querySelectorAll(".choice-btn").forEach((b) => {
      b.onclick = () => {
        rec.finalResponse = b.dataset.v;
        rec.finalResponseTimeMs = Math.round(performance.now() - t0);
        stageFinalConfidence();
      };
    });
  }

  function stageFinalConfidence() {
    flow.innerHTML = `
      <div class="stage-block">
        <div class="locked-chip">Final decision: <b>${rec.finalResponse.toUpperCase()}</b></div>
        <h3>How confident are you in your final decision?</h3>
        ${scaleRowHTML("fc", 1, 5, "Not confident", "Very confident")}
      </div>`;
    flow.querySelectorAll(".scale-btn").forEach((b) => {
      b.onclick = () => finalize(rec.finalResponse, Number(b.dataset.v));
    });
  }

  function finalize(finalResponse, finalConfidence) {
    if (isPractice) {
      state.practiceIdx += 1;
      if (state.practiceIdx >= PRACTICE_LIBRARY.length) { state.screen = "trial"; state.trialIdx = 0; }
      render();
      return;
    }
    const gt = part.groundTruth;
    const initialCorrect = rec.initialResponse === gt;
    const finalCorrect = finalResponse === gt;
    const aiCorrect = advice ? advice.verdict === gt : null;
    const conflict = advice ? rec.initialResponse !== advice.verdict : null;
    const switched = advice ? finalResponse !== rec.initialResponse : null;

    state.results.push({
      trialNumber: current, partId: part.id, difficulty: difficultyOf(part), groundTruth: gt,
      marginRatio: part.visualOnly ? null : Number(marginRatio(part.measurement).toFixed(3)),
      initialResponse: rec.initialResponse, initialCorrect, initialConfidence: rec.initialConfidence,
      initialResponseTimeMs: rec.initialResponseTimeMs,
      aiRecommendation: advice ? advice.verdict : null,
      aiBasis: advice ? advice.basis : null,
      aiCitation: advice ? advice.citation : null,
      aiCorrect, conflict,
      finalResponse, finalCorrect, finalConfidence,
      finalResponseTimeMs: rec.finalResponseTimeMs ?? rec.initialResponseTimeMs,
      totalTimeMs: Math.round(performance.now() - t0),
      switched,
      switchedToAI: advice ? (switched && finalResponse === advice.verdict) : null,
      heldAgainstAI: advice ? (conflict && !switched) : null,
      confidenceShift: rec.initialConfidence != null ? finalConfidence - rec.initialConfidence : null,
      evidenceChecked, evidenceViewTimeMs, evidenceReopened,
    });

    state.trialIdx += 1;
    if (TRUST_PROBE_AFTER.includes(state.trialIdx) && state.trialIdx < PART_LIBRARY.length) state.screen = "trustprobe";
    else if (state.trialIdx >= PART_LIBRARY.length) state.screen = "post";
    else state.screen = "trial";
    render();
  }

  stageInitial();
}

async function saveResponse() {

async function loadAllResponses() {
  let remote = [];
  if (!OFFLINE()) {
    try { remote = await fetchAllSessions(); } catch (e) { console.error("Endpoint unreachable", e); }
  }
  const local = localBuffer();
  const seen = new Set(remote.map((r) => r.participantId));
  const merged = remote.concat(local.filter((r) => !seen.has(r.participantId)));
  merged.sort((a, b) => (a.timestamp < b.timestamp ? 1 : -1));
  return merged;
}
function mean(a) {
  const v = a.filter((x) => x !== null && x !== undefined && !Number.isNaN(x));
  return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
}
function sd(a) {
  const v = a.filter((x) => x !== null && x !== undefined && !Number.isNaN(x));
  if (v.length < 2) return null;
  const m = v.reduce((s, x) => s + x, 0) / v.length;
  return Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1));
}
function pct(n) { return n === null || n === undefined ? "\u2014" : Math.round(n * 100) + "%"; }
function fx(n, d) { return n === null || n === undefined ? "\u2014" : n.toFixed(d); }

const DIFFS = ["Visual", "Measurement", "Judgment", "Ambiguous"];

function computeStats(records) {
  const out = {};
  CONDITIONS.forEach((c) => {
    const recs = records.filter((r) => r.condition === c);
    const T = recs.flatMap((r) => r.trials);
    const aiT = T.filter((t) => t.aiRecommendation !== null);
    const conf = aiT.filter((t) => t.conflict === true);
    const badConf = conf.filter((t) => t.initialCorrect === true && t.aiCorrect === false);
    const goodConf = conf.filter((t) => t.initialCorrect === false && t.aiCorrect === true);
    const perPerson = (fn) => recs.map(fn);
    out[c] = {
      n: recs.length, trials: T.length,
      initAcc: mean(T.map((t) => (t.initialCorrect ? 1 : 0))),
      finalAcc: mean(T.map((t) => (t.finalCorrect ? 1 : 0))),
      finalAccSD: sd(perPerson((r) => mean(r.trials.map((t) => (t.finalCorrect ? 1 : 0))))),
      rt: mean(T.map((t) => t.totalTimeMs)),
      evid: mean(T.map((t) => (t.evidenceChecked ? 1 : 0))),
      evidSD: sd(perPerson((r) => mean(r.trials.map((t) => (t.evidenceChecked ? 1 : 0))))),
      conflictRate: aiT.length ? mean(aiT.map((t) => (t.conflict ? 1 : 0))) : null,
      switchToAI: conf.length ? mean(conf.map((t) => (t.switchedToAI ? 1 : 0))) : null,
      held: conf.length ? mean(conf.map((t) => (t.heldAgainstAI ? 1 : 0))) : null,
      bias: badConf.length ? mean(badConf.map((t) => (t.switchedToAI ? 1 : 0))) : null,
      biasN: badConf.length,
      rescue: goodConf.length ? mean(goodConf.map((t) => (t.switchedToAI ? 1 : 0))) : null,
      rescueN: goodConf.length,
      agree: aiT.length ? mean(aiT.map((t) => (t.finalResponse === t.aiRecommendation ? 1 : 0))) : null,
      confShift: mean(T.map((t) => t.confidenceShift)),
      trust: c === "none" ? null : mean(recs.map((r) => r.post.trust)),
      useful: c === "none" ? null : mean(recs.map((r) => r.post.useful)),
      percAcc: c === "none" ? null : mean(recs.map((r) => r.post.perceivedAccuracy)),
      workload: mean(recs.map((r) => mean(WORKLOAD_ITEMS.map((w) => r.post[w[0]])))),
      byDiff: DIFFS.reduce((acc, d) => {
        const dT = T.filter((t) => t.difficulty === d);
        const dConf = dT.filter((t) => t.conflict === true);
        const dBad = dConf.filter((t) => t.initialCorrect === true && t.aiCorrect === false);
        acc[d] = {
          acc: dT.length ? mean(dT.map((t) => (t.finalCorrect ? 1 : 0))) : null,
          evid: dT.length ? mean(dT.map((t) => (t.evidenceChecked ? 1 : 0))) : null,
          switchToAI: dConf.length ? mean(dConf.map((t) => (t.switchedToAI ? 1 : 0))) : null,
          bias: dBad.length ? mean(dBad.map((t) => (t.switchedToAI ? 1 : 0))) : null,
          biasN: dBad.length,
        };
        return acc;
      }, {}),
      probes: [0, 1].map((i) => mean(recs.map((r) => (r.trustProbes && r.trustProbes[i] ? r.trustProbes[i].value : null)))),
    };
  });
  return out;
}

function exclusionFlags(r) {
  const easy = r.trials.filter((t) => t.difficulty === "Visual");
  const easyAcc = mean(easy.map((t) => (t.initialCorrect ? 1 : 0)));
  const fast = r.trials.filter((t) => t.totalTimeMs < 1500).length;
  const flags = [];
  if (easyAcc !== null && easyAcc < 0.67) flags.push("low visual-trial accuracy");
  if (fast >= 5) flags.push("many sub-1.5s trials");
  return { easyAcc, flags };
}

function toCSV(records) {
  const head = ["ParticipantID","Population","Condition","Timestamp","TrialNumber","PartID","Difficulty","MarginRatio","GroundTruth",
    "InitialResponse","InitialCorrect","InitialConfidence","InitialResponseTime_ms",
    "AI_Recommendation","AI_Basis","AI_Citation","AI_Correct","Conflict",
    "FinalResponse","FinalCorrect","FinalConfidence","ConfidenceShift","FinalResponseTime_ms","TotalTime_ms",
    "Switched","SwitchedToAI","HeldAgainstAI","EvidenceChecked","EvidenceViewTime_ms","EvidenceReopened",
    "TrustProbe1","TrustProbe2","PostTrust","PostUsefulness","PostPerceivedAccuracy",
    "Mental","Temporal","Performance","Effort","Frustration",
    "Intake_AIUsage","Intake_VerificationHabit","Intake_QCFamiliarity","Intake_GeneralAITrust"];
  const esc = (s) => '"' + String(s ?? "").replace(/"/g, '""') + '"';
  const rows = [head.join(",")];
  records.forEach((r) => {
    const ik = r.intake || {}, tp = r.trustProbes || [];
    r.trials.forEach((t) => {
      rows.push([r.participantId, r.population, r.condition, r.timestamp, t.trialNumber, t.partId, t.difficulty, t.marginRatio ?? "", t.groundTruth,
        t.initialResponse, t.initialCorrect, t.initialConfidence, t.initialResponseTimeMs,
        t.aiRecommendation ?? "", t.aiBasis ?? "", esc(t.aiCitation), t.aiCorrect ?? "", t.conflict ?? "",
        t.finalResponse, t.finalCorrect, t.finalConfidence, t.confidenceShift ?? "", t.finalResponseTimeMs, t.totalTimeMs,
        t.switched ?? "", t.switchedToAI ?? "", t.heldAgainstAI ?? "", t.evidenceChecked, t.evidenceViewTimeMs ?? "", t.evidenceReopened,
        tp[0] ? tp[0].value : "", tp[1] ? tp[1].value : "", r.post.trust ?? "", r.post.useful ?? "", r.post.perceivedAccuracy ?? "",
        r.post.mental ?? "", r.post.temporal ?? "", r.post.performance ?? "", r.post.effort ?? "", r.post.frustration ?? "",
        ik.aiUsageFrequency ?? "", ik.verificationHabit ?? "", ik.qcFamiliarity ?? "", ik.generalAITrust ?? ""].join(","));
    });
  });
  return rows.join("\n");
}

function toSummaryCSV(records) {
  const head = ["ParticipantID","Population","Condition","Timestamp","InitialAccuracy","FinalAccuracy",
    "ConflictRate","SwitchToAIRate","HeldAgainstAIRate","BadAdviceSwitchRate","BadAdviceN","RescueRate","RescueN",
    "EvidenceCheckRate","MeanTotalTime_ms","MeanConfidenceShift",
    "TrustProbe1","TrustProbe2","PostTrust","PostUsefulness","PostPerceivedAccuracy","MeanWorkload",
    "EasyTrialAccuracy","ExclusionFlags",
    "Intake_AIUsage","Intake_VerificationHabit","Intake_QCFamiliarity","Intake_GeneralAITrust"];
  const rows = [head.join(",")];
  records.forEach((r) => {
    const ik = r.intake || {}, tp = r.trustProbes || [];
    const T = r.trials, aiT = T.filter((t) => t.aiRecommendation !== null);
    const conf = aiT.filter((t) => t.conflict === true);
    const bad = conf.filter((t) => t.initialCorrect === true && t.aiCorrect === false);
    const good = conf.filter((t) => t.initialCorrect === false && t.aiCorrect === true);
    const ex = exclusionFlags(r);
    rows.push([r.participantId, r.population, r.condition, r.timestamp,
      fx(mean(T.map((t) => (t.initialCorrect ? 1 : 0))), 3), fx(mean(T.map((t) => (t.finalCorrect ? 1 : 0))), 3),
      aiT.length ? fx(mean(aiT.map((t) => (t.conflict ? 1 : 0))), 3) : "",
      conf.length ? fx(mean(conf.map((t) => (t.switchedToAI ? 1 : 0))), 3) : "",
      conf.length ? fx(mean(conf.map((t) => (t.heldAgainstAI ? 1 : 0))), 3) : "",
      bad.length ? fx(mean(bad.map((t) => (t.switchedToAI ? 1 : 0))), 3) : "", bad.length,
      good.length ? fx(mean(good.map((t) => (t.switchedToAI ? 1 : 0))), 3) : "", good.length,
      fx(mean(T.map((t) => (t.evidenceChecked ? 1 : 0))), 3), fx(mean(T.map((t) => t.totalTimeMs)), 0),
      fx(mean(T.map((t) => t.confidenceShift)), 3),
      tp[0] ? tp[0].value : "", tp[1] ? tp[1].value : "",
      r.post.trust ?? "", r.post.useful ?? "", r.post.perceivedAccuracy ?? "",
      fx(mean(WORKLOAD_ITEMS.map((w) => r.post[w[0]])), 2),
      fx(ex.easyAcc, 3), '"' + ex.flags.join("; ") + '"',
      ik.aiUsageFrequency ?? "", ik.verificationHabit ?? "", ik.qcFamiliarity ?? "", ik.generalAITrust ?? ""].join(","));
  });
  return rows.join("\n");
}

          <td><span class="cond-chip ${c}">${CONDITION_LABEL[c]}</span></td><td>${S[c].n}</td>
          <td>${pct(S[c].initAcc)}</td><td>${pct(S[c].finalAcc)} (${fx(S[c].finalAccSD, 3)})</td>
          <td>${pct(S[c].evid)} (${fx(S[c].evidSD, 3)})</td>
          <td>${pct(S[c].bias)}${S[c].biasN ? ` <span style="color:var(--ink-faint)">n=${S[c].biasN}</span>` : ""}</td>
          <td>${fx(S[c].rt, 0)}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="note-sm"><b>Bad-Advice Switch</b> is the headline automation-bias measure: of trials where the participant's own initial call was correct and the AI disagreed and was wrong, how often they abandoned their correct answer. <b>n</b> is the number of such trials pooled across that group.</p>

      <hr class="divider"/>
      <h2>Reliance Detail (AI conditions)</h2>
      <div class="scroll-table"><table class="admin-table">
        <thead><tr><th>Condition</th><th>Conflict Rate</th><th>Switched to AI</th><th>Held Own Call</th><th>Rescue Rate</th><th>Final Agreement</th><th>Conf. Shift</th></tr></thead>
        <tbody>${["high", "low"].map((c) => `<tr>
          <td><span class="cond-chip ${c}">${CONDITION_LABEL[c]}</span></td>
          <td>${pct(S[c].conflictRate)}</td><td>${pct(S[c].switchToAI)}</td><td>${pct(S[c].held)}</td>
          <td>${pct(S[c].rescue)}${S[c].rescueN ? ` <span style="color:var(--ink-faint)">n=${S[c].rescueN}</span>` : ""}</td>
          <td>${pct(S[c].agree)}</td><td>${fx(S[c].confShift, 2)}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="note-sm"><b>Rescue Rate</b> is the mirror of bias: of conflicts where the participant was wrong and the AI was right, how often the AI corrected them. Reliance is only harmful if bias exceeds rescue.</p>

      <hr class="divider"/>
      <h2>Difficulty Breakdown</h2>
      <div class="scroll-table"><table class="admin-table">
        <thead><tr><th>Condition</th><th>Metric</th>${DIFFS.map((d) => `<th>${d}</th>`).join("")}</tr></thead>
        <tbody>${CONDITIONS.map((c) => `
          <tr><td rowspan="3"><span class="cond-chip ${c}">${CONDITION_LABEL[c]}</span></td><td>Final accuracy</td>${DIFFS.map((d) => `<td>${pct(S[c].byDiff[d].acc)}</td>`).join("")}</tr>
          <tr><td>Evidence-check</td>${DIFFS.map((d) => `<td>${pct(S[c].byDiff[d].evid)}</td>`).join("")}</tr>
          <tr><td>Bad-advice switch</td>${DIFFS.map((d) => `<td>${pct(S[c].byDiff[d].bias)}${S[c].byDiff[d].biasN ? ` <span style="color:var(--ink-faint)">n=${S[c].byDiff[d].biasN}</span>` : ""}</td>`).join("")}</tr>
        `).join("")}</tbody>
      </table></div>
      <p class="note-sm">This table is the reliability &times; difficulty interaction the study is built to test. Ambiguous parts cannot be resolved from the data shown to the participant, so behaviour there reflects reliance rather than skill.</p>

      <hr class="divider"/>
      <h2>Trust Trajectory</h2>
      <div class="scroll-table"><table class="admin-table">
        <thead><tr><th>Condition</th><th>After trial 8</th><th>After trial 16</th><th>End of session</th><th>Perceived accuracy</th></tr></thead>
        <tbody>${["high", "low"].map((c) => `<tr><td><span class="cond-chip ${c}">${CONDITION_LABEL[c]}</span></td>
          <td>${fx(S[c].probes[0], 2)}</td><td>${fx(S[c].probes[1], 2)}</td><td>${fx(S[c].trust, 2)}</td><td>${fx(S[c].percAcc, 2)}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="note-sm">Whether trust in the low-reliability group falls across these three points, or holds despite repeated errors, is the direct test of the recalibration question.</p>

      <hr class="divider"/>
      <h2>Population Balance</h2>
      <table class="admin-table">
        <thead><tr><th>Population</th><th>No-AI</th><th>High</th><th>Low</th></tr></thead>
        <tbody>
          <tr><td>Student</td><td>${pop.student.none}</td><td>${pop.student.high}</td><td>${pop.student.low}</td></tr>
          <tr><td>Professional</td><td>${pop.professional.none}</td><td>${pop.professional.high}</td><td>${pop.professional.low}</td></tr>
        </tbody>
      </table>

      <hr class="divider"/>
      <h2>All Sessions (${loaded.length})</h2>
      <div class="scroll-table"><table class="admin-table">
        <thead><tr><th>Participant</th><th>Pop.</th><th>Condition</th><th>Final Acc.</th><th>Visual Acc.</th><th>Flags</th><th>Completed</th></tr></thead>
        <tbody>${loaded.length ? loaded.map((r) => {
          const ex = exclusionFlags(r);
          return `<tr><td class="mono">${r.participantId}</td><td>${r.population}</td>
            <td><span class="cond-chip ${r.condition}">${CONDITION_LABEL[r.condition]}</span></td>
            <td>${pct(mean(r.trials.map((t) => (t.finalCorrect ? 1 : 0))))}</td>
            <td>${pct(ex.easyAcc)}</td>
            <td>${ex.flags.length ? `<span class="flag">${ex.flags.join("; ")}</span>` : "\u2014"}</td>
            <td>${new Date(r.timestamp).toLocaleString()}</td></tr>`;
        }).join("") : `<tr><td colspan="7">No responses yet.</td></tr>`}</tbody>
      </table></div>
      <p class="note-sm">Flags are candidates for exclusion, not automatic removals. Decide your exclusion rule before collecting data and apply it consistently.</p>
    `;
  };
  el.querySelector("#csv").onclick = () => dl(toCSV(loaded), "qc_trial_level.csv", "text/csv");
  el.querySelector("#sum").onclick = () => dl(toSummaryCSV(loaded), "qc_participant_summary.csv", "text/csv");
  el.querySelector("#json").onclick = () => dl(JSON.stringify(loaded, null, 2), "qc_raw.json", "application/json");
}

function dl(text, name, mime) {
  const b = new Blob([text], { type: mime });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
}

render();
</script>
</body>
</html>
